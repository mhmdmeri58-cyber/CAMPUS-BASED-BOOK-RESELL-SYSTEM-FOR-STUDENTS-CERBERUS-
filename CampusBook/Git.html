<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate BMI</title>

    <script>
        function calcBmi() {
            var height = parseFloat(document.getElementById("height").value);
            var weight = parseFloat(document.getElementById("weight").value);

            if (isNaN(height) || isNaN(weight) || height <= 0 || weight <= 0) {
                alert("Please enter valid height and weight.");
                return;
            }

            var bmi = weight / (height * height);

            if (bmi < 18.5) {
                alert("Underweight\nBMI: " + bmi.toFixed(2));
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                alert("Healthy weight\nBMI: " + bmi.toFixed(2));
            } else if (bmi >= 25.0 && bmi <= 29.9) {
                alert("Overweight\nBMI: " + bmi.toFixed(2));
            } else if (bmi >= 30.0) {
                alert("Obesity\nBMI: " + bmi.toFixed(2));
            }
        }
    </script>
</head>
<body>
    <body  background="image/wall1.jpg" ></body>
    <b><P style="color:white;text-align:center;font-size:20px">BMI CALCULATOR</b>
        <br>
        <br>
        <div class="bmi-box">
            <form>
               
                
                   
                    Please Enter Height (Meter):<br>
                    <input type="number" id="height" placeholder="Enter height..."><br><br>
                    Please Enter Weight:<br>
                    <input type="number" id="weight" placeholder="Enter weight..."><br>
               
           
                <p style="text-align:center;">
                    <button type="reset">Reset</button>
                    <br><br>
                    <br>

                    <button type="button" onclick="calcBmi()">Calculate BMI</button>
                    
                </p>
            </form>
        
        
      </div>
      
      <style>
        body {
          background-color: ; 
          font-family: Arial, sans-serif;
        }
      
        .bmi-box {
          background-color: white;
          width: 300px;
          padding: 20px;
          margin: 50px auto; 
          border-radius: 8px;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
      
        .bmi-box input {
          width: 100%;
          padding: 10px;
          margin-bottom: 10px;
          background-color: ;
          border: none;
          border-radius: 4px;
        }
      
        .bmi-box button {
          width: 100%;
          padding: 10px;
          background-color: #44c4ab;
          color: white;
          border: none;
          border-radius: 4px;
          font-weight: bold;
          cursor: pointer;
        }
      
        .bmi-box a {
          display: block;
          margin-top: 10px;
          text-align: center;
          color: #14475c;
          text-decoration: none;
          font-size: 0.9em;
        }
      </style>
    
    

</body>
</html>
